name: 发布网页试玩版

# 每次游戏文件（YuYin/）有改动推送到仓库的默认分支，就把 YuYin/ 文件夹发布到 GitHub Pages：
#   https://wxrkz123.github.io/game/
# 第一次使用前，要在仓库的 Settings → Pages 里把 Source 选成「GitHub Actions」。
# 也可以在 Actions 页面选这个流程，点 Run workflow 手动发布。

on:
  push:
    paths: ['YuYin/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # only the default branch is published; pushes to other branches are skipped
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: YuYin
      - id: deployment
        uses: actions/deploy-pages@v4
